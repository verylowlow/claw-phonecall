name: Bug 报告
description: 拨号不通 / 无声音 / 串口读不到 / 其它异常
title: "[bug] "
labels: bug
body:
  - type: textarea
    id: symptom
    attributes:
      label: 现象
      description: 实际发生了什么？如果有报错日志请贴上来
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: 硬件后端
      options: [SIM7600 4G LTE, SIM800C 2G, USB Voice Modem, Android, Mock, 不确定]
    validations:
      required: true
  - type: input
    id: ports
    attributes:
      label: AT 口 / 音频口
      description: 例如 AT=COM5, Audio=COM6。填 COM 号，不是 /dev/ttyUSBx
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 运行环境
      description: 操作系统 + Python 版本，例如 Windows 11 + Python 3.12
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: AT 命令的收发记录最有帮助
      render: shell
